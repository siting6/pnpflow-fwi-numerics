name: main-tables
on: [push, pull_request]
jobs:
  tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python reproduce/make_tables.py --check
      - run: python -m pytest -q
